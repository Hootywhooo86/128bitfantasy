name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The 128BIT LEAGUES database: schema.sql must apply twice (re-runnable)
  # and a whole league must play through its functions.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/stub-auth.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/flow.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/moves.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/test/extras.sql
